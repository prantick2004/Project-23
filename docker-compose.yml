services:
  postgres:
    image: postgres:16-alpine
    container_name: project23_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Dev-only: exposes DB to host so local `uvicorn --reload` workflow
      # (outside Docker) can connect. Remove/override for real deployment.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project23_net

  redis:
    image: redis:7-alpine
    container_name: project23_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project23_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project23_app
    restart: unless-stopped
    # app-env-override: force container-network hostnames
    environment:
      DATABASE_URL: postgresql+asyncpg://project23_user:${POSTGRES_PASSWORD}@postgres:5432/project23_db
      REDIS_URL: redis://redis:6379/0
    devices:
      # Dev-only: passes host webcam through for local demo/testing.
      # Remove for real server deployment (no physical camera there).
      - "/dev/video0:/dev/video0"
    group_add:
      - "44"  # host's video group GID, lets appuser (non-root) open /dev/video0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - project23_net
    # No host port published — Nginx is the only entrypoint

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: project23_worker
    restart: unless-stopped
    # worker-env-override: force container-network hostnames
    environment:
      DATABASE_URL: postgresql+asyncpg://project23_user:${POSTGRES_PASSWORD}@postgres:5432/project23_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - project23_net

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: project23_beat
    restart: unless-stopped
    # beat-env-override: force container-network hostnames
    environment:
      DATABASE_URL: postgresql+asyncpg://project23_user:${POSTGRES_PASSWORD}@postgres:5432/project23_db
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    networks:
      - project23_net

  nginx:
    image: nginx:1.25-alpine
    container_name: project23_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - project23_net

networks:
  project23_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
